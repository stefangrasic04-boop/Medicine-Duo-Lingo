<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDIQ — Znanje za življenje</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8f4;color:#183a31;font:16px system-ui,sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e3a947;outline-offset:3px}aside{position:fixed;width:230px;height:100vh;background:white;border-right:1px solid #dce5dd;padding:30px 20px} .logo{font-size:38px;font-weight:900;letter-spacing:-3px;color:#167454}.sub{font-size:11px;letter-spacing:2px;color:#64786b}nav{margin-top:35px;display:grid;gap:8px}nav button{border:0;background:transparent;text-align:left;padding:15px;border-radius:12px;color:#536c60;font-weight:700}nav button.active{background:#e3f1e4;color:#146747}main{margin-left:230px;max-width:1300px;padding:32px 5vw}header,.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}header{margin-bottom:26px}.stat{background:white;border:1px solid #dce5dd;padding:10px 16px;border-radius:12px;font-weight:700}.hero{background:#155b48;color:white;padding:38px;border-radius:25px;position:relative;overflow:hidden}.hero h1{font-size:clamp(32px,4vw,55px);line-height:1.05;letter-spacing:-2px;margin:15px 0;max-width:660px}.hero p{color:#d9eddd;max-width:520px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800}.hero .art{float:right;font-size:100px;line-height:1.3}.primary{border:0;background:#157b54;color:white;padding:14px 22px;border-radius:12px;font-weight:800;box-shadow:0 3px 0 #0b5438}.hero .primary{background:#dcf781;color:#254a2e;box-shadow:0 3px 0 #92ad44}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:white;border:1px solid #dce5dd;padding:22px;border-radius:18px;text-align:left;color:inherit}.tile:hover{border-color:#4c9871;transform:translateY(-2px)}.emoji{font-size:32px;background:#edf4e7;display:inline-grid;place-items:center;width:58px;height:58px;border-radius:16px}h2{margin:30px 0 15px;letter-spacing:-.7px}h3{margin:12px 0 5px}p{line-height:1.55;color:#5b7064}.muted{font-size:13px;color:#667b6d}.bar{height:9px;background:#e5ece4;border-radius:20px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#41a273}.option{display:block;width:100%;text-align:left;padding:17px;border:2px solid #dce5dd;background:white;color:#183a31;border-radius:12px;margin:10px 0}.option.good{background:#e1f4e4;border-color:#238652}.option.bad{background:#fde9e6;border-color:#be6258}.feedback{background:#e9f3e5;border-radius:12px;padding:16px;margin:20px 0}.secondary{background:white;border:1px solid #cbdcd0;padding:12px 18px;border-radius:12px;color:#175d45}.lesson{max-width:700px;margin:auto}.pill{background:white;border:1px solid #cbdcd0;border-radius:30px;padding:10px 16px;color:#175d45}.pill.active{background:#dceedd;font-weight:bold}footer{margin-top:40px;font-size:12px;color:#667b6d;line-height:1.6}button:disabled{cursor:default} @media(max-width:750px){aside{position:static;width:auto;height:auto;padding:14px 18px;border:0}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap;padding:10px}main{margin:0;padding:18px}.hero{padding:24px}.hero .art{font-size:55px}.grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.card{padding:15px}}
</style></head><body><aside><div class="logo">mediq<span style="color:#90b94e">.</span></div><div class="sub">ZNANJE ZA ŽIVLJENJE</div><nav id="nav"></nav></aside><main><header><div><strong>Moja učna pot</strong><div class="muted">Majhni koraki. Veliko znanja.</div></div><div class="row"><span class="stat" id="streak"></span><span class="stat" id="xp"></span></div></header><div id="view" aria-live="polite"></div><footer>MEDIQ · Izobraževalni prototip. Vsebina še ni neodvisno strokovno pregledana in ne nadomešča zdravstvene obravnave. V nujnih primerih v Sloveniji pokličite 112. Napredek se shranjuje samo v tem brskalniku.</footer></main><script>
const data=[
['heart','🫀','Človeško telo','Spoznaj srce in krvni obtok','osnove',[
['Kaj je glavna naloga srca?',['Črpanje krvi','Proizvodnja kisika','Filtriranje krvi'],0,'Srce črpa kri in tako omogoča dostavo kisika in hranil tkivom.'],['Koliko votlin ima srce?',['Dve','Tri','Štiri'],2,'Dva preddvora in dva prekata.'],['Kje kri prejme kisik?',['V pljučih','V ledvicah','V jetrih'],0,'Izmenjava plinov poteka v pljučnih alveolih.']]],
['prev','🛡️','Preventiva','Majhne navade, veliki učinki','osnove',[
['Ali je hipertenzija lahko brez simptomov?',['Da','Ne'],0,'Visok krvni tlak pogosto ne povzroča simptomov.'],['Kaj je namen presejanja?',['Zamenjava vseh pregledov','Zgodnje odkrivanje izbranih bolezni','Zdravljenje vseh bolezni'],1,'Presejanje je namenjeno zgodnjemu odkrivanju bolezni ali predstopnj pri določenih skupinah.'],['Katera navada koristi srcu?',['Kajenje','Redno gibanje','Pomanjkanje spanja'],1,'Redna telesna dejavnost koristi srčno-žilnemu zdravju.']]],
['drug','💊','Zdravila','Antibiotiki in varna uporaba','osnove',[
['Ali antibiotiki zdravijo gripo?',['Da','Ne'],1,'Gripa je virusna okužba, antibiotiki pa delujejo proti bakterijam.'],['Ali imata lahko dve različni zdravili isto učinkovino?',['Da','Ne'],0,'Različna tržna imena lahko označujejo isto učinkovino.'],['Kje preverimo navodila za zdravilo?',['V priloženem navodilu in pri farmacevtu','V naključnem komentarju na spletu'],0,'Navodilo za uporabo in zdravstveni strokovnjaki so ustrezni viri.']]],
['aid','⛑️','Prva pomoč','Prepoznaj nujno stanje','osnove',[
['Katera številka je za nujno pomoč v Sloveniji?',['113','112','118'],1,'112 je številka za nujno medicinsko pomoč.'],['Nenadna motnja govora in povešen ustni kot sta lahko znak česa?',['Možganske kapi','Prehlada','Zgage'],0,'Ob sumu na možgansko kap nemudoma pokličemo 112.']]],
['immune','🧬','Imunski sistem','Razumi obrambo telesa','poglobljeno',[
['Katere celice proizvajajo protitelesa?',['Eritrociti','Plazmatke','Trombociti'],1,'Plazmatke so diferencirani limfociti B.'],['Kaj je antigen?',['Struktura, ki jo prepozna imunski sistem','Vrsta krvne žile','Prebavni encim'],0,'Antigen lahko specifično prepoznajo receptorji imunskega sistema.']]],
['pro','🔬','Medicina PRO','Patofiziologija in farmakologija','pro',[
['Kateri encim pretvarja angiotenzin I v angiotenzin II?',['Renin','ACE','Aldosteron'],1,'ACE je angiotenzin-konvertaza.'],['Kako delujejo zaviralci protonske črpalke?',['Zavirajo H+/K+ ATPazo','Aktivirajo receptor H2','Nevtralizirajo že izločeno kislino'],0,'Zavirajo protonsko črpalko parietalnih celic želodca.'],['Kateri mediator je ključen pri anemiji vnetja?',['Insulin','Hepcidin','Tiroksin'],1,'Hepcidin zmanjšuje razpoložljivost železa z zaviranjem feroportina.']]]];
let s={xp:0,done:{},days:[],review:[],level:'vse'};try{Object.assign(s,JSON.parse(localStorage.getItem('mediq-v1')||'{}'))}catch{}let page='home',quiz=null;const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('en-CA');function save(){try{localStorage.setItem('mediq-v1',JSON.stringify(s))}catch{}}function streak(){let d=new Date(),n=0;if(!s.days.includes(today()))d.setDate(d.getDate()-1);while(s.days.includes(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1)}return n}function stats(){$('xp').textContent='⚡ '+s.xp+' XP';$('streak').textContent='🔥 '+streak()+' dni'}const tabs=[['home','⌂ Domov'],['paths','▤ Učne poti'],['review','↻ Ponavljanje'],['profile','◎ Profil']];function go(p){page=p;quiz=null;render()}
function tile(c){return `<button class="card tile" onclick="start('${c[0]}')"><span class="emoji">${c[1]}</span><h3>${c[2]}</h3><p>${c[3]}</p><div class="bar"><div class="fill" style="width:${s.done[c[0]]?100:0}%"></div></div><span class="muted">${s.done[c[0]]?'✓ Opravljeno':'Začni lekcijo'} · ${c[4]}</span></button>`}function render(){stats();$('nav').innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');let v=$('view');if(quiz){drawQuiz();return}if(page==='home'){let c=data.find(x=>!s.done[x[0]])||data[0];v.innerHTML=`<section class="hero"><span class="art">${c[1]}</span><span class="eyebrow">TVOJ DNEVNI ODMEREK ZNANJA</span><h1>5 minut na dan.<br>Boljše razumevanje zdravja.</h1><p>Od osnov človeškega telesa do medicinskega razmišljanja. Uči se v svojem tempu.</p><button class="primary" onclick="start('${c[0]}')">Nadaljuj: ${c[2]} →</button></section><h2>Izberi svojo učno pot</h2><div class="grid">${data.map(tile).join('')}</div>`}else if(page==='paths'){v.innerHTML=`<h1>Učne poti</h1><p>Izberi globino znanja.</p><div class="row">${['vse','osnove','poglobljeno','pro'].map(l=>`<button class="pill ${s.level===l?'active':''}" onclick="level('${l}')">${l}</button>`).join('')}</div><h2>Teme</h2><div class="grid">${data.filter(c=>s.level==='vse'||c[4]===s.level).map(tile).join('')}</div>`}else if(page==='review'){v.innerHTML=`<h1>Ponavljanje</h1><div class="card"><h3>${s.review.length} vprašanj za utrjevanje</h3><p>Ponovi vprašanja, pri katerih si se zmotil.</p>${s.review.length?'<button class="primary" onclick="startReview()">Začni ponavljanje</button>':'Trenutno nimaš vprašanj za ponavljanje.'}</div>`}else{v.innerHTML=`<h1>Moj napredek</h1><div class="grid"><div class="card"><h2>${s.xp} XP</h2>Skupne točke</div><div class="card"><h2>${Object.keys(s.done).length}/${data.length}</h2>Opravljene teme</div><div class="card"><h2>${streak()}</h2>Zaporedni dnevi</div></div><h2>Opravljene teme</h2>${data.map(c=>`<div class="card">${c[1]} ${c[2]} — ${s.done[c[0]]?'opravljeno':'še neopravljeno'}</div>`).join('')}<p><button class="secondary" onclick="resetProgress()">Ponastavi napredek</button></p>`}}function level(l){s.level=l;save();render()}function start(id){let c=data.find(x=>x[0]===id);quiz={title:c[2],id,items:c[5].map((q,i)=>({q,key:id+':'+i})),i:0,score:0,selected:null};drawQuiz()}function startReview(){let items=s.review.map(k=>{let [id,i]=k.split(':');return {key:k,q:data.find(c=>c[0]===id)[5][+i]}});quiz={title:'Ponavljanje',id:null,items,i:0,score:0,selected:null};drawQuiz()}function drawQuiz(){let v=$('view'),z=quiz;if(z.i===z.items.length){v.innerHTML=`<div class="lesson card"><span class="emoji">🏆</span><h1>Odlično opravljeno!</h1><p>Pravilni odgovori: ${z.score}/${z.items.length}. Pridobil si ${z.score*10} XP.</p><button class="primary" onclick="go('home')">Nazaj na začetek</button></div>`;return}let q=z.items[z.i].q;v.innerHTML=`<section class="lesson"><div class="row"><button class="secondary" onclick="go(page)">× Zapri</button><strong>${z.title} · ${z.i+1}/${z.items.length}</strong></div><div class="bar"><div class="fill" style="width:${z.i/z.items.length*100}%"></div></div><h1>${q[0]}</h1>${q[1].map((o,i)=>`<button class="option ${z.selected!==null?(i===q[2]?'good':i===z.selected?'bad':''):''}" ${z.selected!==null?'disabled':''} onclick="choose(${i})">${o}</button>`).join('')}${z.selected!==null?`<div class="feedback"><strong>${z.selected===q[2]?'Pravilno!':'Poglej razlago'}</strong><p>${q[3]}</p></div><button class="primary" onclick="next()">Nadaljuj →</button>`:''}</section>`}function choose(i){let z=quiz;if(z.selected!==null)return;z.selected=i;let item=z.items[z.i];if(i===item.q[2]){z.score++;s.review=s.review.filter(k=>k!==item.key)}else if(!s.review.includes(item.key))s.review.push(item.key);save();drawQuiz()}function next(){let z=quiz;if(z.selected===null)return;z.i++;z.selected=null;if(z.i===z.items.length){s.xp+=z.score*10;if(z.id)s.done[z.id]=true;if(!s.days.includes(today()))s.days.push(today());save();stats()}drawQuiz()}function resetProgress(){if(confirm('Ponastavim ves napredek?')){s={xp:0,done:{},days:[],review:[],level:'vse'};save();render()}}render();
</script></body></html>
